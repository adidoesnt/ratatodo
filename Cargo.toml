[package]
name = "ratatodo"
version = "0.1.0"
description = "A todo list TUI implemented using ratatui"
authors = ["Aditya Banerjee <aditya_banerjee@icloud.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros", "time"] }
tokio = { version = "1.53.1", features = ["full"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
